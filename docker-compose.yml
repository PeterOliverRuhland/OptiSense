# Vier gleiche App-Container, einer pro CPU-Kern: Ein Shiny-Prozess nutzt nur einen Kern.
# Im Lasttest (40 Studierende) stand mit einem Container ein Kern unter Volllast, die anderen drei waren frei.
# Caddy verteilt die Studierenden auf die Container (siehe Caddyfile).

# Docker-Logs pro Container hoechstens 3 x 10 MB, aeltere werden geloescht (sonst wachsen sie unbegrenzt).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  restart: unless-stopped
  # Kein "ports:" - die App ist nur ueber Caddy erreichbar,
  # nicht direkt von aussen auf Port 8000.
  expose:
    - "8000"
  environment:
    LP_SOLVE_BIN: /usr/local/bin/lp_solve
    MPLBACKEND: Agg
  # Haertung: Das Dateisystem ist nur lesbar. Beschreibbar ist allein /tmp, und das liegt im Arbeitsspeicher
  # (Modelldateien fuer lp_solve, hochgeladene .lp-Dateien, Matplotlib-Cache). Keine Linux-Capabilities,
  # keine Rechteausweitung ueber setuid-Programme.
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Grenzen je Container: Ein ueberlasteter Container wird neu gestartet, statt den ganzen Server mitzuziehen.
  # Gemessen (Lasttest, 40 Studierende, 11.11.2026): hoechstens rund 200 MB und 28 Prozesse/Threads je Container;
  # ein PNG mit 600 DPI braucht kurz rund 80 MB mehr. Die Grenzen lassen also viel Luft.
  mem_limit: 1g
  pids_limit: 256
  logging: *logging

services:
  app1: *app
  app2: *app
  app3: *app
  app4: *app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Haertung wie bei der App. Caddy braucht nur das Recht, die Ports 80 und 443 zu oeffnen;
    # schreiben darf es nur in /data (Zertifikate, Zugriffslog), /config und /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # gemessen im selben Lasttest: rund 110 MB und 15 Prozesse/Threads
    mem_limit: 512m
    pids_limit: 128
    logging: *logging
    depends_on:
      - app1
      - app2
      - app3
      - app4

volumes:
  caddy_data:
  caddy_config:
