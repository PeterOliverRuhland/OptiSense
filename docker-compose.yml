# Vier gleiche App-Container, einer pro CPU-Kern: Ein Shiny-Prozess nutzt nur einen Kern.
# Im Lasttest (40 Studierende) stand mit einem Container ein Kern unter Volllast, die anderen drei waren frei.
# Caddy verteilt die Studierenden auf die Container (siehe Caddyfile).
x-app: &app
  build: .
  restart: unless-stopped
  # Kein "ports:" - die App ist nur ueber Caddy erreichbar,
  # nicht direkt von aussen auf Port 8000.
  expose:
    - "8000"
  environment:
    LP_SOLVE_BIN: /usr/local/bin/lp_solve
    MPLBACKEND: Agg

services:
  app1: *app
  app2: *app
  app3: *app
  app4: *app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app1
      - app2
      - app3
      - app4

volumes:
  caddy_data:
  caddy_config:
